<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Game Road Map</title>
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="mockup-road-map">
      <header class="header">
        <img class="image" src="img/image-45.png" alt="Game Logo" />
        <nav class="navigation" role="navigation" aria-label="Main Navigation">
          <a href="../home/home.html" class="text-wrapper">HOME</a>
          <a href="../game/index.html" class="div" aria-current="page">GAME</a>
          <img class="line" src="img/line-13.png" alt="" role="presentation" />
          <a href="../quiz1/index.html" class="text-wrapper-5">QUIZ</a>
        </nav>
      </header>
      <main class="main-content">
        <img class="img" src="img/image-101.png" alt="Game map background" />
        <section class="game-path" aria-label="Game progression path">
          <article class="level-marker level-1">
            <a href="../game1/index.html">
            <img class="image-9" src="img/image-102.png" alt="Starting castle" />
            <img class="image-2" src="img/image-103.png" alt="Path to level 1" />
            <div class="ellipse" role="img" aria-label="Level 1 marker">
              <span class="text-wrapper-2">1</span>
            </div>
            <img class="image-6" src="img/image-105.png" alt="Wizard hat icon" />
            </a>
          </article>
          <article class="level-marker level-2">
            <img class="image-3" src="img/image-104.png" alt="Path to level 2" />
            <div class="ellipse-2" role="img" aria-label="Level 2 marker locked">
              <span class="text-wrapper-3">2</span>
            </div>
            <img class="mingcute-lock-fill-2" src="img/mingcute-lock-fill.png" alt="Locked" />
            <img class="image-7" src="img/image-109.png" alt="Wizard hat icon" />
          </article>
          <article class="level-marker level-3">
            <img class="image-10" src="img/image-110.png" alt="Character figure" />
            <img class="image-4" src="img/image-106.png" alt="Path to level 3" />
            <div class="ellipse-3" role="img" aria-label="Level 3 marker locked">
              <span class="text-wrapper-4">3</span>
            </div>
            <img class="mingcute-lock-fill" src="img/mingcute-lock-fill.svg" alt="Locked" />
            <img class="image-8" src="img/image-107.png" alt="Wizard hat icon" />
            <img class="image-5" src="img/image-108.png" alt="Final destination" />
          </article>
        </section>
      </main>
    </div>
  </body>
</html>
