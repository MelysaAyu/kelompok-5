<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Game - Level 1</title>
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="mockup-game">
      <header class="header">
        <img class="image" src="img/image-45.png" alt="Game Logo" />
        <nav class="navigation" role="navigation" aria-label="Main navigation">
          <a href="#home" class="text-wrapper">HOME</a>
          <a href="#game" class="div" aria-current="page">
            GAME
            <img class="line" src="img/line-13.png" alt="" role="presentation" />
          </a>
          <a href="#quiz" class="text-wrapper-8">QUIZ</a>
        </nav>
      </header>
      <img class="img" src="img/image-73.png" alt="" role="presentation" />
      <section class="game-area" aria-label="Game playing area">
        <img class="image-2" src="img/image-74.png" alt="Game frame" />
        <div class="level-indicator">
          <img class="image-8" src="img/image-86.png" alt="" role="presentation" />
          <h1 class="text-wrapper-6">LEVEL 1</h1>
        </div>
        <div class="card-grid" role="group" aria-label="Card matching game">
          <button class="card-button card-top-left" aria-label="Card 1">
            <img class="image-3" src="img/image-70.png" alt="Game card" />
          </button>
          <button class="card-button card-top-right" aria-label="Card 2">
            <img class="image-6" src="img/image-75.png" alt="Game card" />
          </button>
          <button class="card-button card-bottom-left" aria-label="Card 3">
            <img class="image-4" src="img/image-76.png" alt="Game card" />
          </button>
          <button class="card-button card-bottom-right" aria-label="Card 4">
            <img class="image-5" src="img/image-77.png" alt="Game card" />
          </button>
        </div>
      </section>
      <aside class="scoreboard" aria-label="Game scoreboard">
        <img class="image-7" src="img/image-84.png" alt="" role="presentation" />
        <h2 class="text-wrapper-2">SKOR BOARD</h2>
        <div class="score-display">
          <img class="image-9" src="img/image-85.png" alt="Score icon" />
          <span class="text-wrapper-4" aria-label="Current score">0</span>
          <div class="progress-bar-container">
            <div
              class="rectangle"
              role="progressbar"
              aria-valuenow="0"
              aria-valuemin="0"
              aria-valuemax="2"
              aria-label="Progress: 0 out of 2"
            ></div>
          </div>
          <span class="text-wrapper-3" aria-label="Progress indicator">0/2</span>
        </div>
        <div class="player-info">
          <p class="text-wrapper-5">INIATE</p>
        </div>
        <div class="timer-container">
          <div class="rectangle-2">
            <time class="text-wrapper-7" datetime="PT0M0S">00:00</time>
          </div>
        </div>
      </aside>
    </main>
  </body>
</html>
