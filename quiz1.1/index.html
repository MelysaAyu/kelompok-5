<!DOCTYPE html>
<html lang="id">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Quiz - Personality Test</title>
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="mockup-QUIZ">
      <header class="header">
        <img class="header-background" src="img/header.png" alt="" />
        <img class="logo" src="img/image-45.png" alt="Logo" />
        <nav class="navigation" aria-label="Main navigation">
          <a href="#home" class="nav-link">
            <img class="HOME" src="img/HOME.png" alt="Home" />
          </a>
          <a href="#game" class="nav-link">
            <img class="GAME" src="img/GAME.png" alt="Game" />
          </a>
          <a href="#quiz" class="nav-link nav-link-active" aria-current="page">
            <span class="text-wrapper">QUIZ</span>
            <img class="line" src="img/line-13.png" alt="" aria-hidden="true" />
          </a>
        </nav>
      </header>
      <div class="background-container">
        <img class="img" src="img/image-112.png" alt="" />
        <div class="rectangle" aria-hidden="true"></div>
      </div>
      <section class="quiz-container">
        <div class="div">
          <img class="image-5" src="img/image-119.png" alt="" aria-hidden="true" />
          <img class="image-2" src="img/image-116.png" alt="" aria-hidden="true" />
          <img class="image-4" src="img/image-118.png" alt="" aria-hidden="true" />
          <img class="image-3" src="img/image-117.png" alt="" aria-hidden="true" />
          <h1 class="p">Jika kamu menghadapi masalah besar, apa yang pertama kali kamu lakukan ?</h1>
          <form class="quiz-form" role="group" aria-labelledby="quiz-question">
            <fieldset class="quiz-options">
              <legend class="visually-hidden">Pilih jawaban Anda</legend>
              <div class="quiz-option">
                <input type="radio" id="option-a" name="quiz-answer" value="A" class="quiz-radio" />
                <label for="option-a" class="quiz-label rectangle-2">
                  <span class="text-wrapper-2">A. Menghadapinya langsung tanpa ragu</span>
                </label>
              </div>
              <div class="quiz-option">
                <input type="radio" id="option-b" name="quiz-answer" value="B" class="quiz-radio" />
                <label for="option-b" class="quiz-label rectangle-4">
                  <span class="text-wrapper-3">B. Menyusun strategi agar hasilnya menguntungkan</span>
                </label>
              </div>
              <div class="quiz-option">
                <input type="radio" id="option-c" name="quiz-answer" value="C" class="quiz-radio" />
                <label for="option-c" class="quiz-label rectangle-3">
                  <span class="text-wrapper-5">C. Mencari informasi dan solusi terbaik</span>
                </label>
              </div>
              <div class="quiz-option">
                <input type="radio" id="option-d" name="quiz-answer" value="D" class="quiz-radio" />
                <label for="option-d" class="quiz-label rectangle-5">
                  <span class="text-wrapper-4">D. Meminta bantuan dan bekerja sama</span>
                </label>
              </div>
            </fieldset>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
