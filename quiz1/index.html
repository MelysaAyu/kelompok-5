<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Hogwarts Quiz - Master's Introduction</title>
    <meta
      name="description"
      content="Begin your magical journey within the world of Hogwarts through an interactive quiz experience."
    />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="mockup-QUIZ">
      <header role="banner">
        <img class="header" src="img/header.png" alt="Hogwarts header background" />
        <img class="image" src="img/image-45.png" alt="Hogwarts crest logo" />
        <nav role="navigation" aria-label="Main navigation">
          <a href="#home">
            <img class="HOME" src="img/HOME.png" alt="Home" />
          </a>
          <a href="#game">
            <img class="GAME" src="img/GAME.png" alt="Game" />
          </a>
          <a href="#quiz" class="text-wrapper" aria-current="page">QUIZ</a>
          <img class="line" src="img/line-13.png" alt="" role="presentation" />
        </nav>
      </header>
      <section class="content-section" aria-labelledby="master-title">
        <img class="img" src="img/image-112.png" alt="Hogwarts Great Hall with floating candles" />
        <div class="rectangle" aria-hidden="true"></div>
        <article class="div" role="article" aria-labelledby="master-title">
          <img class="image-2" src="img/image-114.png" alt="Wizard master character illustration" />
          <header class="article-header">
            <img class="group" src="img/group-30.png" alt="Master badge decoration" />
            <h1 class="text-wrapper-2" id="master-title">Master</h1>
          </header>
          <p class="today-you-are-not">
            Today, you are not just answering questions. You are beginning a magical journey within the world of
            Hogwarts. No wand will decide your path,<br />no spell will force your choice. Every decision you make will
            shape your own way forward.
          </p>
          <nav class="navigation-controls" aria-label="Quiz navigation">
            <button type="button" class="image-3-button" aria-label="Previous">
              <img class="image-3" src="img/image-116.png" alt="" />
            </button>
            <button type="button" class="image-4-button" aria-label="Next">
              <img class="image-4" src="img/image-117.png" alt="" />
            </button>
          </nav>
        </article>
      </section>
    </main>
  </body>
</html>
